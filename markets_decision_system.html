<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');
:root{--bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;--accent:#00ff9d;--warn:#ffcc00;--red:#ff3366;--purple:#b06aff;--pink:#ff2d78;--text:#e8e8f0;--muted:#555570;--card:#13131e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;}

.sb-head{padding:16px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:4px;color:var(--accent);margin-bottom:8px;}

.ci-img{width:24px;height:24px;border-radius:50%;flex-shrink:0;background:var(--border);object-fit:cover;}

.up{color:var(--accent)!important;}.dn{color:var(--red)!important;}
.ci-detail{display:none;padding:0 12px 10px 42px;border-top:1px solid rgba(30,30,46,.4);}
.ci.active .ci-detail{display:block;}
.dr{display:flex;justify-content:space-between;padding:2px 0;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
.dv{color:var(--text);}

.dxy-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0;}
.dxy-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex-shrink:0;}

<script>
const API='https://api.anthropic.com/v1/messages';
const MODEL='claude-sonnet-4-20250514';

const SYS=`Je bent een professionele marktenanalist. Mei 2026.
Zoek EERST actuele data. Baseer alles op gevonden data.

Supertrend/Bullflip: bepaal of asset nu BULLISH of BEARISH is op basis van Supertrend logica (ATR-based trendvolger). Geef ook het flip punt — wanneer flipped de trend voor het laast?

Money Line = MA200 niveau. Als prijs erboven = bullish. Eronder = bearish.

Geef ALLEEN pure JSON:
{"name":"naam","ticker":"TICKER","price":"$78,400","priceRaw":78400,"change24h":"+2.4%","changeRaw":2.4,"high52w":"$109,000","low52w":"$52,000","volume":"$32B","marketCap":"$1.57T","rsi":52,"rsiContext":"Uitleg RSI nu in 1 zin.","ma50Raw":75000,"ma200Raw":68000,"ma50":"BOVEN","ma50_bias":"bull","ma200":"BOVEN","ma200_bias":"bull","supertrendBull":true,"flipLabel":"BULLISH","flipLevelPrice":71000,"flipDaysAgo":12,"flipPctChange":10.4,"flipDescription":"Bullflip op 7 mei bij $71,000 na breakdown van bearish trend.","score":72,"scoreLabel":"MIXED","scoreColor":"yellow","regime":"UPTREND","regimeColor":"green","trend":"Trendstructuur nu","story":"2-3 zinnen verhaal gebaseerd op RECENTE data.","priceHistory":[72000,73500,71000,74000,75500,73000,76000,77000,75500,74000,73000,75000,77000,79000,78000,76500,75000,77500,80000,79500,78000,76000,77000,79000,81000,80000,78500,77000,78400,78400],"recentNews":[{"sentiment":"bullish","text":"Specifiek recent nieuws"},{"sentiment":"bearish","text":"Specifiek actueel risico"},{"sentiment":"neutral","text":"Neutrale context"}],"bullCase":"Concreet bullish nu","baseCase":"Meest waarschijnlijk nu","bearCase":"Concreet bearish nu","risks":["Actueel risico 1","Actueel risico 2","Actueel risico 3"],"verdict":"Zakelijke conclusie. Max 2 zinnen.","tvSymbol":"NASDAQ:NVDA","dataSource":"bronnen"}`;

let allCryptos=[],cryptoScores={},chartInstance=null,currentA=null;

function qs(t){document.getElementById('searchInput').value=t;runAnalysis();}
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')runAnalysis();});

function fmtP(p){
  if(p==null)return'—';
  if(p>=1e6)return'$'+(p/1e6).toFixed(2)+'M';
  if(p>=1000)return'$'+(p/1000).toFixed(1)+'K';
  if(p>=1)return'$'+p.toFixed(2);
  if(p>=0.001)return'$'+p.toFixed(4);
  return'$'+p.toFixed(8);
}

function calcSMA(data,period){
  return data.map((_,i)=>{
    if(i<period-1)return null;
    return data.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period;
  });
}

function calcSupertrend(prices,period=7,mult=3){
  const n=prices.length;
  if(n<period+2)return{line:prices.map((_,i)=>prices[i]*0.98),bull:prices.map(()=>true)};
  // ATR
  const atr=new Array(n).fill(0);
  for(let i=1;i<n;i++){
    const tr=Math.abs(prices[i]-prices[i-1]);
    atr[i]=i<period?tr:(atr[i-1]*(period-1)+tr)/period;
  }
  atr[0]=prices[0]*0.015;
  // Bands
  const up=prices.map((p,i)=>p+mult*atr[i]);
  const dn=prices.map((p,i)=>p-mult*atr[i]);
  const fUp=[...up],fDn=[...dn];
  for(let i=1;i<n;i++){
    fUp[i]=fUp[i]<fUp[i-1]||prices[i-1]>fUp[i-1]?fUp[i]:fUp[i-1];
    fDn[i]=fDn[i]>fDn[i-1]||prices[i-1]<fDn[i-1]?fDn[i]:fDn[i-1];
  }
  const bull=[true],line=[fDn[0]];
  for(let i=1;i<n;i++){
    const b=bull[i-1]?(prices[i]>=fDn[i]):(prices[i]>fUp[i]);
    bull.push(b);
    line.push(b?fDn[i]:fUp[i]);
  }
  return{line,bull};
}

function getTVUrl(sym){
  if(!sym)return'https://www.tradingview.com';
  const s=encodeURIComponent('RSI@tv-basicstudies,MASimple@tv-basicstudies,MASimple@tv-basicstudies');
  return`https://www.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}&studies=${s}`;
}

const STEPS=['LIVE DATA OPHALEN...','NIEUWS ANALYSEREN...','RSI · MA · SUPERTREND...','BULLFLIP DETECTEREN...'];

function showLoading(name){
  document.getElementById('resultArea').innerHTML=`
    <div class="loading">
      <div class="spinner"></div>
      <div style="font-family:'Space Mono',monospace;font-size:11px;color:var(--text);letter-spacing:2px;margin-bottom:12px;">${name.toUpperCase()}</div>
      ${STEPS.map((s,i)=>`<div class="step" id="st${i}">${s}</div>`).join('')}
    </div>`;
  let i=0;const iv=setInterval(()=>{if(i<STEPS.length){const e=document.getElementById('st'+i);if(e)e.classList.add('on');i++;}else clearInterval(iv);},700);
  return iv;
}

async function runAnalysis(nameOvr){
  const input=nameOvr||document.getElementById('searchInput').value.trim();
  if(!input)return;
  if(!nameOvr)document.getElementById('searchInput').value=input;
  const btn=document.getElementById('searchBtn');
  btn.disabled=true;btn.textContent='...';
  const iv=showLoading(input);
  try{
    const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,max_tokens:1800,system:SYS,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:`Zoek data en analyseer: ${input}. Search "${input} price news May 2026" en "${input} technical analysis RSI". Return ALLEEN pure JSON.`}]})});
    clearInterval(iv);
    const data=await resp.json();
    let text='';if(data.content)for(const b of data.content)if(b.type==='text')text+=b.text;
    let a;
    try{const cl=text.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();const s=cl.indexOf('{'),e=cl.lastIndexOf('}');if(s!==-1&&e!==-1)a=JSON.parse(cl.substring(s,e+1));else throw 0;}
    catch{const m=text.match(/\{[\s\S]*\}/);if(m)a=JSON.parse(m[0]);else throw new Error('Parse failed');}
    if(a.ticker)cryptoScores[a.ticker.toUpperCase()]={score:a.score,color:a.scoreColor};
    updateSidebarScores();
    currentA=a;
    renderAnalysis(a);
  }catch(err){
    clearInterval(iv);
    document.getElementById('resultArea').innerHTML=`<div class="err">⚠ Analyse mislukt: ${err.message}</div>`;
  }
  btn.disabled=false;btn.textContent='SEARCH';
}

    <div class="price-row">

        <div class="flip-info">
          <div class="flip-desc">${a.flipDescription||'Geen flip data beschikbaar'}</div>
          <div class="flip-meta">FLIP LEVEL: ${a.flipLevelPrice?fmtP(a.flipLevelPrice):'—'}</div>
        </div>
        <div class="flip-stats">
          <div class="flip-pct" style="color:${flipPctC}">${a.flipPctChange!=null?(a.flipPctChange>=0?'+':'')+a.flipPctChange.toFixed(1)+'%':'—'}</div>
          <div class="flip-days">${a.flipDaysAgo!=null?a.flipDaysAgo+' dagen geleden':'—'}</div>

    <!-- CHART -->
    <div class="chart-area">
      <div class="chart-legend">
        <div class="leg"><div class="leg-line" style="background:${isUp?'#00ff9d':'#ff3366'};"></div>Prijs</div>
        <div class="leg"><div class="leg-line" style="background:${isBull?'#00ff9d':'#ff2d78'};height:4px;"></div>Supertrend ${isBull?'▲':'▼'}</div>
        <div class="leg"><div style="width:22px;height:3px;background:#fff;border-radius:1px;"></div>Money Line (MA200)</div>

        <div class="sc sc-bull"><span style="flex-shrink:0;">🟢</span><span><strong>Bullish:</strong> ${a.bullCase}</span></div>
        <div class="sc"><span style="flex-shrink:0;">⚪</span><span><strong>Base case:</strong> ${a.baseCase}</span></div>
        <div class="sc sc-bear"><span style="flex-shrink:0;">🔴</span><span><strong>Bearish:</strong> ${a.bearCase}</span></div>
      </div>
      <div class="sec-lbl">RISICO'S</div>
      <div class="risks">${risksHtml}</div>
      <div class="divl"></div>
      <div class="verdict"><strong>VERDICT:</strong> ${a.verdict}</div>
    </div>
  </div>`;

  setTimeout(()=>{
    const canvas=document.getElementById('priceChart');
    if(!canvas)return;
    const prices=a.priceHistory||[];
    if(prices.length<4)return;
    const isUp2=a.changeRaw!=null?a.changeRaw>=0:!((a.change24h||'').startsWith('-'));
    const isBull2=a.supertrendBull!==false;
    const priceLineC=isUp2?'#00ff9d':'#ff3366';
    const stLineC=isBull2?'#00cc7a':'#ff2d78';
    const ma50data=calcSMA(prices,Math.min(10,Math.floor(prices.length/3)));
    const st=calcSupertrend(prices);
    const labels=prices.map((_,i)=>{
      const d=new Date();d.setDate(d.getDate()-(prices.length-1-i));
      return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
    });
    // MA200 as flat money line (use provided value or avg)
    const mlVal=a.ma200Raw||(prices.reduce((s,v)=>s+v,0)/prices.length);
    const mlData=prices.map(()=>mlVal);

    chartInstance=new Chart(canvas,{
      type:'line',
      data:{
        labels,
        datasets:[
          // Price fill
          {label:'Prijs',data:prices,borderColor:priceLineC,backgroundColor:isUp2?'rgba(0,255,157,0.07)':'rgba(255,51,102,0.07)',borderWidth:2.5,pointRadius:0,fill:true,tension:0.3,order:1},
          // Supertrend — thick colored stepped line
          {label:'Supertrend',data:st.line,borderColor:stLineC,borderWidth:3,pointRadius:0,fill:false,tension:0,spanGaps:true,order:2,
           segment:{borderColor:ctx=>{
             const idx=ctx.p0DataIndex;
             return st.bull[idx]?'#00cc7a':'#ff2d78';
           }}
          },
          // Money line — thick white
          {label:'Money Line MA200',data:mlData,borderColor:'rgba(255,255,255,0.9)',borderWidth:2.5,pointRadius:0,fill:false,tension:0,order:3},
          // MA50 — yellow dashed
          {label:'MA50',data:ma50data,borderColor:'#ffcc00',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,tension:0.3,spanGaps:true,order:4}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>{const v=ctx.raw;if(v==null)return null;return ctx.dataset.label+': '+(v>=1000?'$'+(v/1000).toFixed(1)+'K':'$'+v.toFixed(2));}}}
        },
        scales:{
          x:{display:false},
          y:{display:true,grid:{color:'rgba(255,255,255,0.04)',drawBorder:false},
            ticks:{font:{size:9,family:'Space Mono'},color:'#555570',callback:v=>v>=1000?'$'+(v/1000).toFixed(0)+'K':'$'+v.toFixed(0),maxTicksLimit:5}}
        }
      }
    });
  },80);
}

function renderCryptoList(list){

  el.innerHTML=list.map((c,i)=>{
    const sym=c.symbol.toUpperCase();
    const cached=cryptoScores[sym];
    const badge=cached?`<span class="badge b${cached.color.charAt(0)}">${cached.score}</span>`:'<span class="badge bn">—</span>';
    const chg=c.price_change_percentage_24h;
    const chgStr=chg!=null?(chg>=0?'+'+chg.toFixed(1)+'%':chg.toFixed(1)+'%'):'';

    return`<div class="ci" id="ci-${c.id}" onclick="toggleCI('${c.id}','${c.name}')">
      <div class="ci-row">
        <span class="ci-rank">${c.market_cap_rank||i+1}</span>
        <img class="ci-img" src="${c.image||''}" alt="${sym}" onerror="this.style.display='none'">
        <div class="ci-info"><div class="ci-sym">${sym}</div><div class="ci-name">${c.name}</div></div>
        <div class="ci-right">${badge}<div class="ci-price">${pStr}</div><div class="ci-price ${chgCls}" style="font-size:9px;">${chgStr}</div></div>

  if(!was){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function updateSidebarScores(){
  document.querySelectorAll('.ci').forEach(el=>{
    const sym=el.querySelector('.ci-sym')?.textContent;if(!sym)return;
    const c=cryptoScores[sym.toUpperCase()];if(!c)return;
    const b=el.querySelector('.badge');if(b){b.textContent=c.score;b.className='badge b'+c.color.charAt(0);}
  });
}
function filterCrypto(q){
  if(!q){renderCryptoList(allCryptos);return;}
  renderCryptoList(allCryptos.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.symbol.toLowerCase().includes(q.toLowerCase())));
}

loadDXY();
loadCrypto();
</script>
